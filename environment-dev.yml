name: crimm-dev
# Development environment for crimm and crimm-ml.
# Create:  conda env create -f environment-dev.yml
# Then, from the crimm checkout:
#   pip install -e ".[all,test]" --no-deps
#   pip install -e ../crimm-ml --no-deps      # if you have a crimm-ml checkout
# CHARMM, pyCHARMM and CGenFF are not installable from conda; set them up separately.
channels:
  - conda-forge
dependencies:
  - python=3.12
  # crimm core
  - numpy>=1.24
  - scipy>=1.11
  - biopython>=1.83
  - pandas>=2.0
  - requests>=2.31
  - pysocks
  # crimm optional: visualization, cheminformatics, protonation, MD engines
  - nglview>=3.1
  - ipywidgets>=8.1
  - py3dmol
  - rdkit>=2023
  - propka>=3.5.1
  - openmm
  - openbabel
  # crimm-ml
  - onnxruntime>=1.18
  - omegaconf>=2.3
  - platformdirs>=3
  - tqdm
  # development tools
  - pytest>=7
  - pytest-cov
  - pytest-xdist
  - nbmake
  - ruff
  - pre-commit
  - nox
  - sphinx
  - python-build
  - twine
  - jupyterlab>=4.2
  - ipykernel
  - gh
  - pip
