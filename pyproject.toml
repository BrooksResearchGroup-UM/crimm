[build-system]
requires = ["setuptools>=59.0", "numpy>=1.21.2"]
build-backend = "setuptools.build_meta"

[project]
name = "crimm"
version = "2026.2"
authors = [
  { name="Truman Xu", email="ziqiaoxu@umich.edu" },
  { name="Stanislav Cherepanov", email="stanislc@umich.edu" },
]
description = "Chemistry with the ReInvented Macromolecular Mechanics"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "biopython>=1.80",
    "ipywidgets>=8",
    "nglview>=3.1",
    "scipy>=1.10",
    "requests>=2.28",
    "pandas>=1.5",
    "requests[socks]",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
]

[project.optional-dependencies]
protonation = ["propka>=3.5.1"]
cheminformatics = ["rdkit"]
all = ["propka>=3.5.1", "rdkit"]
test = ["pytest>=7"]

[project.urls]
"Homepage" = "https://github.com/BrooksResearchGroup-UM/crimm"
"Bug Tracker" = "https://github.com/BrooksResearchGroup-UM/crimm/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is offline and fast. Select the others explicitly, e.g.
# `pytest -m network` or `pytest -m "cgenff or slow"`; `pytest -m ""` runs all.
addopts = "--strict-markers -m 'not network and not pycharmm and not cgenff and not slow and not gpu'"
markers = [
    "network: needs internet access (RCSB, AlphaFold DB)",
    "pycharmm: needs pyCHARMM and a CHARMM library",
    "cgenff: needs the cgenff executable (set CRIMM_CGENFF_PATH or put it on PATH)",
    "slow: takes more than a few seconds",
    "gpu: marks tests that require GPU",
]

[tool.mypy]
# Only check files explicitly passed; don't follow imports into
# untyped/third-party modules that have their own pre-existing issues.
follow_imports = "silent"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["./"]
exclude = [
    "src",
    "__pycache__",
    ".ipynb_checkpoints",
    "*.egg-info",
    "tests"
]
namespaces = false
