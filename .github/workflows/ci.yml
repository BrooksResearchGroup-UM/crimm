# Lint and offline tests on every pull request to master and every push to master.
# CHARMM, pyCHARMM, CGenFF and network tests are not run here (they are deselected by the
# pytest markers in pyproject.toml); a maintainer runs them by hand before a release.
name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: a new ruff release can add rules and turn a green build red by itself.
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Lint
        run: ruff check crimm tests
      - name: Format
        run: ruff format --check crimm tests

  test:
    # TODO(#131): ubuntu-latest (26.04) has no Python 3.9 for setup-python, so the 3.9
    # cells run on 24.04. Drop Python 3.9 before GitHub retires that image.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # Let every combination finish, so the pattern of failures is visible.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        numpy: ["<2", ">=2"]
        exclude:
          # NumPy 1.26 has no wheels for Python 3.13, so this combination cannot exist.
          - python-version: "3.13"
            numpy: "<2"
    name: test (py${{ matrix.python-version }}, numpy${{ matrix.numpy }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The NumPy line under test is a requirement of the same install as crimm, so the
      # resolver must keep it. Installed in a separate step first, pip upgraded it to
      # NumPy 2 in the Python 3.12 cell while resolving [all] (run 38329748488).
      # [all] so that the tests of the optional features run; the core-install job
      # below checks crimm without them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]" "numpy${{ matrix.numpy }}"
      # Fails the cell if the installed NumPy is not the line the cell is named for.
      - name: Show versions
        run: |
          python -c "import sys, numpy, scipy, Bio; print(sys.version); print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'biopython', Bio.__version__)"
          python -c "import numpy; major = int(numpy.__version__.split('.')[0]); assert (major < 2) == ('${{ matrix.numpy }}' == '<2'), numpy.__version__"
      - name: Test (offline suite)
        run: pytest -p no:cacheprovider -q

  # `import crimm` must work with only the core dependencies (#58). Installs the built
  # wheel with no extras, so it also checks the wheel's Requires-Dist.
  core-install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install it without extras
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl pytest
      - name: No optional package is installed
        run: |
          python -c "import importlib.util as u; found = [m for m in ('rdkit', 'nglview', 'ipywidgets', 'py3Dmol') if u.find_spec(m)]; assert not found, found"
      # Run from outside the checkout, so the installed wheel is imported, not ./crimm.
      - name: Import crimm from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import crimm, crimm.Adaptors, crimm.Modeller, crimm.Superimpose, crimm.Visualization; print(crimm.__file__)"
      - name: Optional-import tests, with the packages really absent
        run: pytest -p no:cacheprovider -q tests/test_optional_imports.py

  # One stable name for branch protection: the matrix cells above have many names that
  # change whenever the matrix does.
  all-green:
    if: always()
    needs: [lint, test, core-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "core-install: ${{ needs.core-install.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.core-install.result }}" = "success" ]
